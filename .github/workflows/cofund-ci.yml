name: CoFund CI/CD Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================================
  # JOB 1 — Vérification du code (tourne à chaque push)
  # ============================================================
  tests:
    name: Tests & Vérification
    runs-on: ubuntu-latest

    steps:
      # 1. Télécharge le code du repo
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installer PHP 8.2
      - name: Installer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite
          coverage: none

      # 3. Mettre en cache les dépendances Composer (plus rapide)
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # 4. Installer les dépendances PHP
      - name: Installer les dépendances (composer install)
        run: composer update --no-interaction --prefer-dist --optimize-autoloader

      # 5. Créer le fichier .env pour les tests
      - name: Créer le fichier .env
        run: |
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      # 6. Générer la clé Laravel
      - name: Générer la clé APP_KEY
        run: php artisan key:generate

      # 7. Vérifier que la config Laravel est valide
      - name: Vérifier la configuration Laravel
        run: php artisan config:clear && php artisan route:list

      # 8. Lancer les migrations sur SQLite en mémoire
      - name: Lancer les migrations
        run: php artisan migrate --force

      # 9. Lancer les tests PHPUnit
      - name: Lancer les tests
        run: php artisan test --env=testing

  # ============================================================
  # JOB 2 — Déploiement (tourne SEULEMENT quand on merge dans main)
  # ============================================================
  deploy:
    name: Déploiement sur Railway
    runs-on: ubuntu-latest
    needs: tests                     # attend que les tests passent
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Railway CLI
        run: npm install -g @railway/cli

      - name: Déployer sur Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}