name: CoFund CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests & Vérification
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: Supprimer composer.lock (évite les conflits)
        run: rm -f composer.lock

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Créer le fichier .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configurer SQLite
        run: |
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

      - name: Lancer les migrations
        run: php artisan migrate --force

      - name: Vérifier les routes
        run: php artisan route:list

      - name: Lancer les tests (sans --env=testing)
        run: php artisan test