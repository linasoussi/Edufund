name: CoFund CI/CD Pipeline

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================================
  # JOB 1 — Tests & Vérification
  # ============================================================
  tests:
    name: Tests & Vérification
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite
          coverage: none

      - name: Supprimer le composer.lock pour éviter les conflits
        run: rm -f composer.lock

      - name: Installer les dépendances PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Créer le fichier .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Configurer la base de données SQLite
        run: |
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

      - name: Lancer les migrations
        run: php artisan migrate --force

      - name: Vérifier les routes Laravel
        run: php artisan route:list

      - name: Lancer les tests
        run: php artisan test --env=testing

  # ============================================================
  # JOB 2 — Déploiement (seulement sur main)
  # ============================================================
  deploy:
    name: Déploiement sur Railway
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Railway CLI
        run: npm install -g @railway/cli

      - name: Déployer sur Railway
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}