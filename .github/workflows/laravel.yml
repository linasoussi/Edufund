name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cofunds
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_NAME: Laravel
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cofunds
      DB_USERNAME: root
      DB_PASSWORD: root
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, mysql, pdo_mysql, bcmath, json

      - name: Copier .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Installer les dépendances
        run: composer install --no-ansi --no-interaction --no-scripts --prefer-dist

      - name: Générer APP_KEY
        run: php artisan key:generate

      - name: Permissions storage et cache
        run: chmod -R 777 storage bootstrap/cache

      - name: Attendre MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root --password=root --silent && break
            echo "Attente MySQL... ($i/30)"
            sleep 2
          done

      - name: Lancer les migrations
        run: php artisan migrate --force

      - name: Lancer les tests PHPUnit
        run: php artisan test
